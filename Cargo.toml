[workspace]
resolver = "2"
members = ["crates/core", "crates/agent", "crates/cli", "apps/desktop/src-tauri"]
# The desktop crate pulls the whole Tauri/WebView stack; keep plain `cargo test`
# focused on the engine. CI builds the desktop crate explicitly.
default-members = ["crates/core", "crates/agent", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Kalanguinnnn/Elo"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
